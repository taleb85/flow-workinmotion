name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    env:
      # Le icone PWA sono già committate in public/: in CI non serve rigenerarle (evita dipendenza da sharp)
      SKIP_ICON_GEN: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run npm run build
        id: build
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "### Build failed — ultime 60 righe" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- dist:" >> "$GITHUB_STEP_SUMMARY"
            ls -la dist dist/assets 2>&1 >> "$GITHUB_STEP_SUMMARY"
            MSG=$(tail -60 /tmp/build.log | tr '\n' ' ' | sed 's/[^[:print:]]/ /g' | cut -c1-3500)
            echo "::error title=Build fallita (ultime righe)::$MSG"
            exit $EXIT
          fi
      - name: Upload build log (diagnostica)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test -- --run

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    env:
      # Dummy: la build (senza .env) deve poter rendere la pagina di login
      VITE_SUPABASE_URL: 'https://test.supabase.co'
      VITE_SUPABASE_ANON_KEY: 'test-anon-key'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Lighthouse collect
        id: collect
        run: |
          set +e
          npx lhci collect --config=.lighthouserc.json 2>&1 | tee /tmp/lhci-collect.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            MSG=$(tail -30 /tmp/lhci-collect.log | tr '\n' ' ' | sed 's/[^[:print:]]/ /g' | cut -c1-2500)
            echo "::error title=Lighthouse collect fallita::$MSG"
            exit $EXIT
          fi
      - name: Lighthouse assert
        id: assert
        run: |
          set +e
          npx lhci assert --config=.lighthouserc.json 2>&1 | tee /tmp/lhci-assert.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            MSG=$(tail -40 /tmp/lhci-assert.log | tr '\n' ' ' | sed 's/[^[:print:]]/ /g' | cut -c1-2500)
            echo "::error title=Lighthouse assert fallita::$MSG"
            exit $EXIT
          fi
      - name: Upload LHCI log (diagnostica)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-log
          path: |
            /tmp/lhci-collect.log
            /tmp/lhci-assert.log
          if-no-files-found: ignore
