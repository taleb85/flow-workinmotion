  <head>
    <!-- Blocco accesso se non installata come PWA -->
    <style>
      #pwa-required-screen {
        display: none;
        position: fixed;
        inset: 0;
        background: #0a0a0e;
        z-index: 999999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        color: #fff;
      }
      #pwa-required-screen.show { display: flex; }
      #pwa-required-screen .logo {
        width: 80px; height: 80px;
        border-radius: 22px;
        background: linear-gradient(135deg, #253660, #1a2744);
        box-shadow: 0 0 30px rgba(255,149,0,0.3);
        margin-bottom: 24px;
        display: flex; align-items: center; justify-content: center;
      }
      #pwa-required-screen h1 {
        font-size: 20px; font-weight: 700; margin: 0 0 8px;
      }
      #pwa-required-screen p {
        font-size: 13px; color: rgba(255,255,255,0.5);
        max-width: 280px; line-height: 1.5;
      }
    </style>
    <script>
      (function(){
        if (window.matchMedia('(display-mode: standalone)').matches) return;
        if (navigator.standalone === true) return;
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return;

        document.documentElement.style.overflow = 'hidden';
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) root.style.display = 'none';

          var screen = document.createElement('div');
          screen.id = 'pwa-required-screen';
          screen.className = 'show';
          screen.innerHTML =
            '<div class="logo"><svg width="44" height="44" viewBox="0 0 160 160"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffcc00"/><stop offset="60%" stop-color="#ff9900"/><stop offset="100%" stop-color="#e07800"/></linearGradient></defs><rect width="160" height="160" rx="28" fill="#1a2744"/><rect x="21" y="44" width="118" height="22" rx="11" fill="#3a2e35"/><rect x="21" y="44" width="86" height="22" rx="11" fill="url(#fg)"/><rect x="21" y="76" width="118" height="22" rx="11" fill="#3a2e35"/><rect x="21" y="76" width="118" height="22" rx="11" fill="#253660"/><rect x="21" y="108" width="118" height="22" rx="11" fill="#3a2e35"/><rect x="21" y="108" width="60" height="22" rx="11" fill="url(#fg)"/></svg></div>' +
            '<h1>FLOW</h1>' +
            '<p>FLOW è disponibile solo come app installata.<br>Apri l\'app dalla schermata Home o dal menu Applicazioni.</p>';
          document.body.insertBefore(screen, document.body.firstChild);
        });
      })();
    </script>
    <script>
      (function(){
        var th = 'dark';
        try {
          var s = localStorage.getItem('flow-theme');
          if (s === 'light' || s === 'dark') th = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', th);
        if (th === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        try { localStorage.removeItem('userTheme'); localStorage.removeItem('theme'); } catch(e){}

        if(location.search.includes('nocache=1')){
          var clr = function(){
            var p = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              p.push(navigator.serviceWorker.getRegistrations().then(function(r){ return Promise.all(r.map(function(s){return s.unregister();})); }));
            }
            if (window.caches && window.caches.keys) {
              p.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(k){return caches.delete(k);})); }));
            }
            Promise.all(p).then(function(){ location.replace(location.pathname+(location.hash||'')||'/'); });
          };
          clr();
          return;
        }

        /* Cache-bust unificato: confronta la versione BUILD (iniettata da Vite) con localStorage.
           Se l'app.html servito dal SW è vecchio, la versione BUILD è quella VECCHIA e il confronto
           fallisce. Per questo facciamo SUBITO un fetch diretto a /app-version.txt (bypassando SW
           con cache: 'no-store') per ottenere la versione REALE dal server. */
        var BUILD_VERSION = '__INJECTED_CACHE_VERSION__';
        var isBuildVersion = BUILD_VERSION !== ('__INJECTED' + '_CACHE_VERSION__');

        function clearAllAndReload(newVer) {
          try { localStorage.setItem('app_cache_version', newVer); } catch(e){}
          var p = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            p.push(navigator.serviceWorker.getRegistrations().then(function(r){ return Promise.all(r.map(function(s){ return s.unregister(); })); }));
          }
          if (window.caches && window.caches.keys) {
            p.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(k){ return caches.delete(k); })); }));
          }
          Promise.all(p).then(function(){ location.reload(); });
        }

        /* Se abbiamo una versione BUILD valida, confrontala subito con localStorage */
        if (isBuildVersion) {
          var saved;
          try { saved = localStorage.getItem('app_cache_version'); } catch(e){}
          if (saved !== BUILD_VERSION) {
            clearAllAndReload(BUILD_VERSION);
            return;
          }
        }

        /* Fallback: fetch diretto a /app-version.txt con retry in caso di fallimento.
           Questo è CRUCIALE su iOS PWA dove il fetch potrebbe fallire la prima volta. */
        if ('fetch' in window) {
          var attempts = 0;
          var maxAttempts = 3;
          var delay = 100;
          function fetchVersion() {
            var bust = 't=' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            fetch('/app-version.txt?' + bust, { cache: 'no-store' })
              .then(function (r) {
                if (!r.ok) return null;
                return r.text();
              })
              .then(function (net) {
                if (!net) return;
                var v = (net + '').trim();
                if (v.length > 120 || v.indexOf('<') >= 0 || v.indexOf('\n') >= 0) return;
                var s = null;
                try { s = localStorage.getItem('app_cache_version'); } catch (e) {}
                if (v && v !== s) {
                  clearAllAndReload(v);
                }
              })
              .catch(function () {
                /* Retry con backoff esponenziale - iOS PWA spesso fallisce il primo fetch */
                attempts++;
                if (attempts < maxAttempts) {
                  setTimeout(fetchVersion, delay);
                  delay *= 2;
                }
              });
          }
          fetchVersion();
        }
      })();
    </script>
    <script>
      /* Forza reload quando il nuovo service worker prende controllo — fix iOS PWA stuck on old version */
      (function () {
        if (!('serviceWorker' in navigator)) return;
        /* Quando il SW cambia controller (nuovo SW attivato con skipWaiting), ricarica la pagina */
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          window.location.reload();
        });
        /* Ogni volta che l'app torna in primo piano, chiedi al SW di controllare aggiornamenti */
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) reg.update();
            }).catch(function () {});
          }
        });
      })();
    </script>
    <script>
      (function () {
        try {
          var w = typeof window.innerWidth === 'number' ? window.innerWidth : 800;
          var h = typeof window.innerHeight === 'number' ? window.innerHeight : 600;
          /* Usa sempre la dimensione minore (larghezza da verticale) anche in orizzontale */
          var effW = Math.min(w, h);
          var eff = effW < 1000 ? 'compact' : 'comfortable';
          var vc = effW < 640 ? 'phone' : effW < 1000 ? 'tablet' : 'desktop';
          document.documentElement.setAttribute('data-layout-preset', 'auto');
          document.documentElement.setAttribute('data-layout-effective', eff);
          document.documentElement.setAttribute('data-viewport-class', vc);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      /* Flag iOS per ridurre gli effetti GPU pesanti (blur aurora, backdrop-filter):
         causa frequente del crash "Abnormally stopped" di Safari su iPhone. */
      (function () {
        document.documentElement.setAttribute(
          'data-ios',
          /iphone|ipad|ipod/i.test(navigator.userAgent || '') ? '1' : '0'
        );
      })();
    </script>
    <script>
      /* iOS standalone: dopo un reload/refresh `innerHeight` (e quindi 100dvh/
         fill-available) può restare "corto" (altezza senza la zona status bar),
         lasciando una banda vuota in fondo. `visualViewport.height` resta invece
         sempre l'altezza reale: la applichiamo a #root via variabile CSS.
         In standalone, all'avvio, usiamo anche screen.height come valore pieno. */
      (function () {
        var isStandalone = function () {
          return window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        };
        var setH = function (allowScreen) {
          var vv = window.visualViewport;
          var h = vv && vv.height ? vv.height : window.innerHeight;
          if (allowScreen && isStandalone() && window.screen && window.screen.height && h < window.screen.height) {
            h = window.screen.height;
          }
          if (h > 0) document.documentElement.style.setProperty('--app-vh', h + 'px');
        };
        setH(true);
        window.addEventListener('resize', function () { setH(false); });
        window.addEventListener('orientationchange', function () { setTimeout(function () { setH(true); }, 200); });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setH(false); });
        window.addEventListener('load', function () { setH(true); });
        /* Correzione post-reload: riprova nei primi frame utili */
        setTimeout(function () { setH(true); }, 250);
        setTimeout(function () { setH(true); }, 800);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) setTimeout(function () { setH(true); }, 150);
        });
      })();
    </script>

    <!-- Fonts: preconnect anticipato per ridurre TTFB sui sottodomini Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Inter (font UI principale): non-blocking via preload → onload swap.
      display=swap già nel URL: il testo è leggibile con font di sistema
      prima che Inter sia scaricato, senza layout shift bloccante.
    -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.rel='stylesheet'">
    <!--
      Font decorativi (header tipografico): caricati dopo il primo paint,
      non bloccano FCP né LCP.
    -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Parisienne&family=Great+Vibes&family=Playfair+Display:wght@700;800&family=Montserrat:wght@700;800&display=swap"
      onload="this.rel='stylesheet'">
    <!-- Fallback per browser senza JS (non blocca il rendering nel caso normale) -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Parisienne&family=Great+Vibes&family=Playfair+Display:wght@700;800&family=Montserrat:wght@700;800&display=swap">

        var u = document.querySelector('meta[property="og:url"]');

        var im = document.querySelector('meta[property="og:image"]');
        if (im) im.setAttribute('content', origin + '/og-image.png');
