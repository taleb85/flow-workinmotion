    <!-- Cattura beforeinstallprompt prima che React carichi (race condition fix) -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
    <!-- Banner installazione PWA iOS — visibile subito, prima che React carichi -->
    <style>
      /* Schermata di installazione — visibile solo se NON in modalità app */
      #pwa-install-screen {
        display: none;
        position: fixed;
        inset: 0;
        background: #020617;
        z-index: 999999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        color: #fff;
      }
      #pwa-install-screen.show { display: flex; }
      #pwa-install-screen .logo {
        width: 100px;
        height: 100px;
        border-radius: 26px;
        background: linear-gradient(135deg, #253660, #1a2744);
        box-shadow: 0 0 40px rgba(255,149,0,0.5);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;

        font-weight: 900;

        color: #FF9500;
      }
      #pwa-install-screen h1 {
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 6px 0;
      }
      #pwa-install-screen .subtitle {
        font-size: 13px;
        color: rgba(255,255,255,0.5);
        margin: 0 0 28px 0;
      }
      #pwa-install-screen .step {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 300px;
        padding: 12px 16px;
        border-radius: 14px;

        margin-bottom: 10px;
        font-size: 13px;
        text-align: left;

      }
      #pwa-install-screen .step-num {
        width: 26px;
        height: 26px;

        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12px;

        flex-shrink: 0;

        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        display: none;
      }
      #pwa-install-screen .install-btn.show { display: block; }
    </style>
    <script>
      (function(){
        var ua = navigator.userAgent;
        var isIOS = /iPhone|iPad|iPod/.test(ua);
        var isAndroid = /Android/.test(ua);
        var isStandalone = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

        // Se è in modalità app → tutto normale, React carica
        if (isStandalone) return;

        // Su localhost/development non bloccare
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return;

        // Nascondi #root per evitare sovrapposizione React
        document.documentElement.style.overflow = 'hidden';

        function buildInstallScreen() {
          var screen = document.createElement('div');
          screen.id = 'pwa-install-screen';
          screen.className = 'show';

          var inner = '';
          inner += '<div class="logo">F</div>';
          inner += '<h1>Installa FLOW</h1>';
          inner += '<p class="subtitle">Aggiungi l\'app alla schermata Home per iniziare</p>';

          if (isIOS) {
            inner += '<div class="step"><span class="step-num">1</span>Tocca ☰ nella barra indirizzi di Safari</div>';
            inner += '<div class="step"><span class="step-num">2</span>Scorri e tocca <strong>Aggiungi a Schermata Home</strong></div>';
            inner += '<div class="step"><span class="step-num">3</span>Tocca <strong>Aggiungi</strong> per confermare</div>';
          } else if (isAndroid) {
            inner += '<div class="step"><span class="step-num">1</span>Tocca ⋮ in alto a destra</div>';
            inner += '<div class="step"><span class="step-num">2</span>Seleziona <strong>Installa app</strong> o <strong>Aggiungi a Home</strong></div>';
            inner += '<div class="step"><span class="step-num">3</span>Conferma l\'installazione</div>';
            inner += '<button class="install-btn" id="pwa-install-btn">📲 Installa l\'app</button>';
          } else {
            inner += '<div class="step"><span class="step-num">1</span>Clicca l\'icona ⊕ nella barra indirizzi</div>';
            inner += '<div class="step"><span class="step-num">2</span>Seleziona <strong>Installa</strong></div>';
            inner += '<div class="step"><span class="step-num">3</span>FLOW apparirà sul desktop</div>';
            inner += '<button class="install-btn" id="pwa-install-btn">📲 Installa l\'app</button>';
          }

          screen.innerHTML = inner;
          document.body.insertBefore(screen, document.body.firstChild);

          // Bottone install (Android/Desktop)
          var installBtn = document.getElementById('pwa-install-btn');
          if (installBtn) {
            var deferredPrompt = window.__deferredInstallPrompt;
            if (deferredPrompt) {
              installBtn.classList.add('show');
              installBtn.addEventListener('click', function() {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(result) {
                  if (result.outcome === 'accepted') {
                    // L'app è stata installata — ricarica
                    window.location.reload();
                  }
                });
              });
            }
            // Ascolta anche eventi futuri (se il listener non ha ancora catturato)
            window.addEventListener('beforeinstallprompt', function(e) {
              e.preventDefault();
              window.__deferredInstallPrompt = e;
              installBtn.classList.add('show');
              installBtn.addEventListener('click', function() {
                e.prompt();
                e.userChoice.then(function(result) {
                  if (result.outcome === 'accepted') window.location.reload();
                });
              });
            }, { once: true });
          }
        }

        // Nascondi #root mentre la schermata install è visibile
        var root = document.getElementById('root');
        if (root) root.style.display = 'none';

        document.addEventListener('DOMContentLoaded', buildInstallScreen);
      })();
    </script>
    <script>
      (function(){
        var th = 'dark';
        try {
          var s = localStorage.getItem('flow-theme');
          if (s === 'light' || s === 'dark') th = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', th);
        if (th === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        try { localStorage.removeItem('userTheme'); localStorage.removeItem('theme'); } catch(e){}

        if(location.search.includes('nocache=1')){
          var clr = function(){
            var p = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              p.push(navigator.serviceWorker.getRegistrations().then(function(r){ return Promise.all(r.map(function(s){return s.unregister();})); }));
            }
            if (window.caches && window.caches.keys) {
              p.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(k){return caches.delete(k);})); }));
            }
            Promise.all(p).then(function(){ location.replace(location.pathname+(location.hash||'')||'/'); });
          };
          clr();
          return;
        }

        /* Cache-bust unificato: confronta la versione BUILD (iniettata da Vite) con localStorage.
           Se l'app.html servito dal SW è vecchio, la versione BUILD è quella VECCHIA e il confronto
           fallisce. Per questo facciamo SUBITO un fetch diretto a /app-version.txt (bypassando SW
           con cache: 'no-store') per ottenere la versione REALE dal server. */
        var BUILD_VERSION = '__INJECTED_CACHE_VERSION__';
        var isBuildVersion = BUILD_VERSION !== ('__INJECTED' + '_CACHE_VERSION__');

        function clearAllAndReload(newVer) {
          try { localStorage.setItem('app_cache_version', newVer); } catch(e){}
          var p = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            p.push(navigator.serviceWorker.getRegistrations().then(function(r){ return Promise.all(r.map(function(s){ return s.unregister(); })); }));
          }
          if (window.caches && window.caches.keys) {
            p.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(k){ return caches.delete(k); })); }));
          }
          Promise.all(p).then(function(){ location.reload(); });
        }

        /* Se abbiamo una versione BUILD valida, confrontala subito con localStorage */
        if (isBuildVersion) {
          var saved;
          try { saved = localStorage.getItem('app_cache_version'); } catch(e){}
          if (saved !== BUILD_VERSION) {
            clearAllAndReload(BUILD_VERSION);
            return;
          }
        }

        /* Fallback: fetch diretto a /app-version.txt con retry in caso di fallimento.
           Questo è CRUCIALE su iOS PWA dove il fetch potrebbe fallire la prima volta. */
        if ('fetch' in window) {
          var attempts = 0;
          var maxAttempts = 3;
          var delay = 100;
          function fetchVersion() {
            var bust = 't=' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            fetch('/app-version.txt?' + bust, { cache: 'no-store' })
              .then(function (r) {
                if (!r.ok) return null;
                return r.text();
              })
              .then(function (net) {
                if (!net) return;
                var v = (net + '').trim();
                if (v.length > 120 || v.indexOf('<') >= 0 || v.indexOf('\n') >= 0) return;
                var s = null;
                try { s = localStorage.getItem('app_cache_version'); } catch (e) {}
                if (v && v !== s) {
                  clearAllAndReload(v);
                }
              })
              .catch(function () {
                /* Retry con backoff esponenziale - iOS PWA spesso fallisce il primo fetch */
                attempts++;
                if (attempts < maxAttempts) {
                  setTimeout(fetchVersion, delay);
                  delay *= 2;
                }
              });
          }
          fetchVersion();
        }
      })();
    </script>
    <script>
      /* Forza reload quando il nuovo service worker prende controllo — fix iOS PWA stuck on old version */
      (function () {
        if (!('serviceWorker' in navigator)) return;
        /* Quando il SW cambia controller (nuovo SW attivato con skipWaiting), ricarica la pagina */
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          window.location.reload();
        });
        /* Ogni volta che l'app torna in primo piano, chiedi al SW di controllare aggiornamenti */
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) reg.update();
            }).catch(function () {});
          }
        });
      })();
    </script>
    <script>
      (function () {
        try {
          var w = typeof window.innerWidth === 'number' ? window.innerWidth : 800;
          var h = typeof window.innerHeight === 'number' ? window.innerHeight : 600;
          /* Usa sempre la dimensione minore (larghezza da verticale) anche in orizzontale */
          var effW = Math.min(w, h);
          var eff = effW < 1000 ? 'compact' : 'comfortable';
          var vc = effW < 640 ? 'phone' : effW < 1000 ? 'tablet' : 'desktop';
          document.documentElement.setAttribute('data-layout-preset', 'auto');
          document.documentElement.setAttribute('data-layout-effective', eff);
          document.documentElement.setAttribute('data-viewport-class', vc);
        } catch (e) {}
      })();
    </script>
