<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* FLOW Redesign — Dark raffinato
   Palette: nero pulito, verde smeraldo come azione primaria, dettagli moderni. */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme: dark;

  /* ── Superfici ─────────────────────────────── */
  --flow-background: #0b0b0e;
  --flow-foreground: #f4f4f5;
  --flow-card: #131318;
  --flow-card-foreground: #f4f4f5;
  --flow-popover: #17171d;
  --flow-popover-foreground: #f4f4f5;
  --flow-muted: #1a1a21;
  --flow-muted-foreground: #9a9aa4;
  --flow-surface-2: #1e1e26;
  --flow-border: #26262e;
  --flow-input: #23232b;
  --flow-ring: #10b981;

  /* ── Brand (unico hue: smeraldo) ───────────── */
  --flow-primary: #10b981;
  --flow-primary-foreground: #052e22;
  --flow-primary-hover: #0da371;
  --flow-primary-soft: rgba(16, 185, 129, 0.12);
  --flow-primary-softer: rgba(16, 185, 129, 0.07);

  /* ── Stati semantici ───────────────────────── */
  --state-success: #10b981;
  --state-warning: #f59e0b;
  --state-error: #f0433f;
  --state-info: #38bdf8;
  --flow-success-soft: rgba(16, 185, 129, 0.12);
  --flow-warning-soft: rgba(245, 158, 11, 0.12);
  --flow-error-soft: rgba(240, 67, 63, 0.12);
  --flow-info-soft: rgba(56, 189, 248, 0.12);

  /* ── Chrome app ────────────────────────────── */
  --flow-header-bg: rgba(11, 11, 14, 0.78);
  --flow-navbar-bg: rgba(11, 11, 14, 0.86);

  /* ── Raggi ─────────────────────────────────── */
  --flow-radius-sm: 4px;
  --flow-radius-md: 8px;
  --flow-radius-lg: 12px;
  --flow-radius-pill: 999px;

  /* ── Tipografia ────────────────────────────── */
  --flow-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* ── Ombre (solo floating layer) ───────────── */
  --flow-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

@theme inline {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* ─────────────────────────────────────────────
   Chrome condiviso dell'app
   ───────────────────────────────────────────── */

.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px;
  background: var(--flow-header-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--flow-border);
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.app-brand-mark {
  width: 32px;
  height: 32px;
  flex: none;
  border-radius: 9px;
  background: var(--flow-primary);
  color: var(--flow-primary-foreground);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.02em;
}

.app-brand-name {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.15;
}

.app-brand-sub {
  font-size: 11px;
  color: var(--flow-muted-foreground);
  line-height: 1.2;
  margin-top: 1px;
}

.app-header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.app-icon-btn {
  position: relative;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--flow-radius-pill);
  color: var(--flow-muted-foreground);
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.app-icon-btn:hover {
  background: var(--flow-muted);
  color: var(--flow-foreground);
}

.notif-dot {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--flow-primary);
  border: 1.5px solid var(--flow-background);
}

.app-avatar {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--flow-foreground);
  background: var(--flow-muted);
  border: 1px solid var(--flow-border);
  flex: none;
}

/* ── Bottom navigation ──────────────────────── */

.app-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: var(--flow-navbar-bg);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-top: 1px solid var(--flow-border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.app-nav-inner {
  max-width: 480px;
  margin: 0 auto;
  height: 64px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

.app-nav-item {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--flow-muted-foreground);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  transition: color 0.15s ease;
}

.app-nav-item[data-active="true"] {
  color: var(--flow-primary);
}

.app-nav-icon {
  width: 21px;
  height: 21px;
  flex: none;
}

.app-nav-label {
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1;
}

/* ── Layout contenuto ───────────────────────── */

.app-main {
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 20px calc(64px + env(safe-area-inset-bottom, 0px) + 28px);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.page-subtitle {
  font-size: 13px;
  color: var(--flow-muted-foreground);
  margin-top: 4px;
}

/* ── Componenti ─────────────────────────────── */

.flow-card {
  background: var(--flow-card);
  border: 1px solid var(--flow-border);
  border-radius: var(--flow-radius-lg);
  padding: 16px;
}

.flow-card-inset {
  background: var(--flow-muted);
  border-radius: var(--flow-radius-md);
  border: 1px solid transparent;
}

.flow-section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  color: var(--flow-muted-foreground);
}

.flow-kpi {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.flow-time {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.flow-label {
  font-size: 12px;
  color: var(--flow-muted-foreground);
}

.flow-divider {
  height: 1px;
  background: var(--flow-border);
  border: 0;
  margin: 0;
}

/* Badge stato */
.flow-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 9px;
  border-radius: var(--flow-radius-pill);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.flow-badge-success { color: var(--state-success); background: var(--flow-success-soft); }
.flow-badge-warning { color: var(--state-warning); background: var(--flow-warning-soft); }
.flow-badge-error   { color: var(--state-error);   background: var(--flow-error-soft); }
.flow-badge-info    { color: var(--state-info);    background: var(--flow-info-soft); }
.flow-badge-neutral { color: var(--flow-muted-foreground); background: var(--flow-muted); }

/* Chip filtro */
.flow-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 13px;
  border-radius: var(--flow-radius-pill);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--flow-muted-foreground);
  background: var(--flow-muted);
  border: 1px solid var(--flow-border);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
}

.flow-chip-active {
  color: var(--flow-primary);
  background: var(--flow-primary-soft);
  border-color: var(--flow-primary);
}

/* Pulsanti */
.flow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 46px;
  padding: 0 18px;
  border-radius: var(--flow-radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.flow-btn:active { transform: scale(0.98); }

.flow-btn-primary {
  background: var(--flow-primary);
  color: var(--flow-primary-foreground);
}

.flow-btn-primary:hover { background: var(--flow-primary-hover); }

.flow-btn-secondary {
  background: var(--flow-muted);
  color: var(--flow-foreground);
  border-color: var(--flow-border);
}

.flow-btn-secondary:hover { background: var(--flow-surface-2); }

.flow-btn-ghost {
  background: transparent;
  color: var(--flow-foreground);
  border-color: var(--flow-border);
}

.flow-btn-ghost:hover { background: var(--flow-muted); }

/* Riga lista */
.flow-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: left;
  color: var(--flow-foreground);
  transition: background-color 0.15s ease;
}

.flow-row:hover { background: var(--flow-primary-softer); }

.flow-chevron {
  color: var(--flow-muted-foreground);
  flex: none;
}

/* Avatar squadra */
.flow-avatar {
  width: 36px;
  height: 36px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: var(--flow-foreground);
  background: var(--flow-muted);
  border: 1px solid var(--flow-border);
  flex: none;
}

/* Barra progresso */
.flow-progress {
  height: 6px;
  border-radius: 999px;
  background: var(--flow-muted);
  overflow: hidden;
}

.flow-progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--flow-primary);
}

/* Barre grafico CSS */
.chart-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 128px;
}

.chart-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  height: 100%;
}

.chart-bar {
  width: 100%;
  max-width: 34px;
  border-radius: 6px 6px 2px 2px;
  background: var(--flow-primary-soft);
  position: relative;
  transition: background-color 0.15s ease;
}

.chart-col[data-active="true"] .chart-bar {
  background: var(--flow-primary);
}

.chart-value {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--flow-muted-foreground);
  font-variant-numeric: tabular-nums;
}

.chart-label {
  font-size: 10.5px;
  color: var(--flow-muted-foreground);
  font-weight: 500;
}

/* Toggle */
.flow-toggle {
  width: 42px;
  height: 24px;
  border-radius: 999px;
  border: 1px solid var(--flow-border);
  background: var(--flow-muted);
  position: relative;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
  flex: none;
}

.flow-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: var(--flow-muted-foreground);
  transition: transform 0.18s ease, background-color 0.15s ease;
}

.flow-toggle[data-on="true"] {
  background: var(--flow-primary);
  border-color: var(--flow-primary);
}

.flow-toggle[data-on="true"]::after {
  transform: translateX(18px);
  background: var(--flow-primary-foreground);
}

<style id="flow-responsive">
@media (min-width: 1024px) {
  .app-header { padding: 14px 32px; }
  .app-main {
    max-width: 1160px !important;
    padding: 28px 32px 48px !important;
    gap: 20px !important;
  }
  .app-nav-inner { max-width: 1160px !important; }
  .page-title { font-size: 30px; }

  /* Attiva la griglia a 2 colonne dove il contenuto lo richiede */
  .app-main:has(> section[aria-label="Saluto"]),
  .app-main:has(> section[aria-labelledby]),
  .app-main:has(> .legend-row),
  .app-main:has(> .month-switcher),
  .app-main:has(> .flow-group),
  .app-main:has(> .staff-tabbar),
  .app-main:has(> .period-selector),
  .app-main:has(> section[aria-label="Nuova richiesta"]),
  .app-main:has(> .month-switcher-card) {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    align-items: start !important;
  }

  /* Elementi full-width (titoli, filtri, righe complete) */
  .app-main > div,
  .app-main > .staff-back,
  .app-main > .legend-row,
  .app-main > .page-title,
  .app-main > section[aria-label="Saluto"] {
    grid-column: 1 / -1;
  }

  /* Home: timbratura + riepilogo in riga, turno + team in riga */
  .app-main:has(> section[aria-label="Saluto"]) > #punch-card { grid-column: 1; grid-row: 2; }
  .app-main:has(> section[aria-label="Saluto"]) > section[aria-label="Riepilogo"] { grid-column: 2; grid-row: 2; }
  .app-main:has(> section[aria-label="Saluto"]) > section[aria-label="Turno di oggi"] { grid-column: 1; grid-row: 3; }
  .app-main:has(> section[aria-label="Saluto"]) > section[aria-label="Team oggi"] { grid-column: 2; grid-row: 3; }
  .app-main:has(> section[aria-label="Saluto"]) > section[aria-label="Prossimi turni"] { grid-column: 1 / -1; grid-row: 4; }

  /* Turni: gruppi giorno affiancati */
  .app-main:has(> section[aria-labelledby]) > section[aria-labelledby] { grid-column: auto; }

  /* Presenze: scheda dipendente full-width */
  .app-main:has(> .legend-row) > .legend-row { grid-column: 1 / -1; grid-row: 3; }
  .app-main:has(> .legend-row) > .flow-card:last-child { grid-column: 1 / -1; grid-row: 4; }

  /* Statistiche: card in auto-placement a 2 colonne */
  .app-main:has(> .month-switcher) > .flow-card { grid-column: auto; }

  /* Impostazioni: gruppi affiancati */
  .app-main:has(> .flow-group) > .flow-group { grid-column: auto; }
  .app-main:has(> .flow-group) > section[aria-label="Profilo"] { grid-column: 1 / -1; }

  /* Vista dipendente (staff) */
  .app-main:has(> .staff-tabbar) > section[aria-label="Profilo"] { grid-column: 1; grid-row: 2; }
  .app-main:has(> .staff-tabbar) > #punch-card { grid-column: 2; grid-row: 2; }
  .app-main:has(> .staff-tabbar) > .staff-kpi-row { grid-column: 1 / -1; grid-row: 3; }
  .app-main:has(> .staff-tabbar) > section[aria-label="I tuoi prossimi turni"] { grid-column: 1 / -1; grid-row: 4; }

  /* Dipendente · Turni */
  .app-main:has(> .period-selector) > .period-selector { grid-column: 1; grid-row: 2; }
  .app-main:has(> .period-selector) > .staff-kpi-row { grid-column: 2; grid-row: 2; }
  .app-main:has(> .period-selector) > section[aria-label="Elenco turni"] { grid-column: 1 / -1; grid-row: 3; }

  /* Dipendente · Ferie */
